name: Paquete offline de Windows

on:
  workflow_dispatch:
  push:
    branches: [desarrollo/mono]
    paths:
      - .github/workflows/windows-offline.yml
      - pyproject.toml
      - src/**
      - casos/**
      - datos/**
      - fuente/**
      - tests/fixtures/ola1/Sistema_Costos.xlsx
      - tools/windows/**

permissions:
  contents: read

jobs:
  paquete:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Obtener el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar Python x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Compilar y comprobar el ejecutable
        run: python tools/windows/build.py
      - name: Subir ZIP portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/ReynaCostos-Windows-x64.zip
          archive: false
          if-no-files-found: error
